output_dir: ./outputs/checkpoints
num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
warmup_ratio: 0.03
lr_scheduler_type: cosine
logging_steps: 10
save_steps: 100
eval_steps: 100
save_total_limit: 2
bf16: true
fp16: false
optim: paged_adamw_8bit
max_grad_norm: 0.3
report_to: none
