version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analyticx_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Analyticx AI
      - DATABASE_URL=sqlite:////app/storage/analyticx.db
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      - JWT_SECRET=${JWT_SECRET:-analyticx_super_secret_production_key_change_me}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DEFAULT_MODEL=qwen3:4b-instruct
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:80
      - UPLOAD_DIR=/app/storage/uploads
    volumes:
      - analyticx_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analyticx_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  analyticx_data:
    name: analyticx_storage_volume
